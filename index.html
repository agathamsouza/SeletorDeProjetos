<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0
        }

        nav {
            background-image: linear-gradient(to right, #643da1, #5a38a2, #4f33a2, #412fa3, #2f2ba4);
        }

        body {
            background-image: linear-gradient(to right bottom, #00122e, #001b4d, #08216c, #302288, #5818a1);
        }

        a {
            color: aliceblue !important;
        }

        a:hover {
            color: #211664 !important;
        }

        footer {
            background-image: linear-gradient(to left, #643da1, #5a38a2, #4f33a2, #412fa3, #2f2ba4);
        }

        main {
            margin-bottom: 40px;
        }

        .btn {
            background-color: #3d337c;
            border-color: #875ec9;
        }
    </style>

</head>

<body>

    <div class="container-fluid d-flex flex-column" style="min-height: 100vh;">

                    <img width="96" height="96" src="https://img.icons8.com/nolan/96/html-5.png" alt="html-5" /> <b>
                        HTML5 </b>
                    <img width="96" height="96" src="https://img.icons8.com/nolan/96/css3.png" alt="css3" /> <b> CSS3

                </p>

                <br>

                <div class="row">

                    <div class="col d-flex flex-wrap gap-5 justify-content-center">

                        <div class="card" style="width: 18rem;">
                            <img src="./images/gatinho.jpg" class="card-img-top" alt="...">

                                <h5 class="card-title" style="color: aliceblue;">Projeto1</h5>
                                <p class="card-text"></p>
                                <a href="./projetos/projeto1/projeto1.html" class="btn btn-primary">Ir para o

                                <h5 class="card-title" style="color: aliceblue;">Projeto2</h5>
                                <p class="card-text"></p>
                                <a href="./projetos/projeto2/" class="btn btn-primary">Ir para o Projeto</a>

                        </div>

                        <div class="card" style="width: 18rem;">

        <footer class="mt-auto">

            </ul>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
